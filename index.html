<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Volunteers</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#f5f7fb;color:#172033;padding:28px 16px}
.wrap{max-width:1000px;margin:auto}
h1{text-align:center;font-size:27px;margin:0 0 6px}
.sub{text-align:center;color:#778196;font-size:13px;margin:0 0 22px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
#contador{font-size:13px;color:#687386}
.btn{border:0;background:#111827;color:white;border-radius:20px;padding:8px 15px;font-size:12px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.person{background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:17px}
.person-name{font-size:17px;font-weight:700;margin-bottom:8px}
.slot{font-size:15px;color:#26344a}
.zone{font-size:12px;color:#778196;margin:5px 0 13px}
.reserve{display:inline-block;background:#1d4ed8;color:#fff;text-decoration:none;border-radius:8px;padding:9px 13px;font-size:13px;font-weight:700}
#estado{background:white;border:1px solid #e2e7ef;border-radius:12px;padding:20px;text-align:center;color:#778196;font-size:13px}
.don{margin-top:22px;background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:18px;text-align:center}
#btnDonar{width:100%;max-width:280px;margin-top:10px;background:#111827;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
@media(max-width:620px){.grid{grid-template-columns:1fr}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Available Volunteers</h1>
<p class="sub">See the first available date and time for each volunteer.</p>
<div class="bar">
  <span id="contador">Loading availability...</span>
  <button id="btnActualizar" class="btn">Refresh</button>
</div>
<div id="estado">Checking for available time slots...</div>
<section id="lista" class="grid"></section>
<div class="don">
  <b>Is this useful?</b>
  <p style="font-size:11px;color:#888;margin-top:4px">Done by Luis Lazo (Cohort 24 &lt;3)</p>
  <button id="btnDonar">Donate $1</button>
  <p id="estadoDonacion" style="font-size:11px;color:#999;margin-top:6px"></p>
</div>
</div>
<script>
const DATA_URL="https://raw.githubusercontent.com/luislazorios/available-times/main/personas.json";
const LAMBDA_DONACION_URL="https://nbacik7xz4nsbh7meqdqvyvxsq0etwmp.lambda-url.sa-east-1.on.aws/";
const listaEl=document.getElementById("lista");
const estadoEl=document.getElementById("estado");
const contadorEl=document.getElementById("contador");

function formatDate(value){
  if(!value) return "";
  const match=String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!match) return value;
  const date=new Date(Date.UTC(Number(match[1]),Number(match[2])-1,Number(match[3])));
  return date.toLocaleDateString("en-US",{timeZone:"UTC",weekday:"short",month:"short",day:"numeric",year:"numeric"});
}

function crearTarjeta(p){
  const card=document.createElement("article");
  card.className="person";
  const nombre=document.createElement("div");
  nombre.className="person-name";
  nombre.textContent=p.nombre||"Volunteer";
  const slot=document.createElement("div");
  slot.className="slot";
  slot.textContent=(formatDate(p.fecha)||"Date not available")+" · "+(p.hora||"Time not available");
  const zone=document.createElement("div");
  zone.className="zone";
  zone.textContent=p.zona_horaria||"";
  const link=document.createElement("a");
  link.className="reserve";
  link.href=p.link||"#";
  link.target="_blank";
  link.rel="noopener";
  link.textContent="View and Book";
  card.append(nombre,slot,zone,link);
  return card;
}

async function cargarPersonas(){
  estadoEl.style.display="block";
  estadoEl.textContent="Checking for available time slots...";
  listaEl.replaceChildren();
  try{
    const r=await fetch(DATA_URL+"?t="+Date.now());
    if(!r.ok) throw new Error("Could not load personas.json.");
    const d=await r.json();
    const registros=Array.isArray(d.personas)?d.personas:[];
    // Only show volunteers with a confirmed date AND time.
    const personas=registros.filter(p=>
      p && p.tiene_cita!==false &&
      typeof p.fecha==="string" && /^\d{4}-\d{2}-\d{2}$/.test(p.fecha) &&
      typeof p.hora==="string" && p.hora.trim().length>0 &&
      typeof p.link==="string" && p.link.startsWith("https://")
    );
    personas.sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")||(a.hora||"").localeCompare(b.hora||""));
    contadorEl.textContent=personas.length+" available out of "+(d.revisados||0)+" checked";
    if(!personas.length){
      estadoEl.textContent="No confirmed available time slots found. Please check again later.";
    }else{
      estadoEl.style.display="none";
      personas.forEach(p=>listaEl.appendChild(crearTarjeta(p)));
    }
    if(d.actualizado){
      const fecha=new Date(d.actualizado);
      const stamp=document.createElement("p");
      stamp.className="sub";
      stamp.textContent="Last updated: "+fecha.toLocaleString("en-US",{timeZone:"America/Santiago"});
      listaEl.before(stamp);
    }
  }catch(e){
    estadoEl.textContent="Could not load the data. "+e.message;
    contadorEl.textContent="Availability unavailable";
  }
}

async function donar(){
  const el=document.getElementById("estadoDonacion");
  el.textContent="Connecting to Mercado Pago...";
  try{
    const res=await fetch(LAMBDA_DONACION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({})});
    const txt=await res.text();
    const data=JSON.parse(txt);
    if(data.url_pago) window.location.href=data.url_pago;
    else if(data.init_point) window.location.href=data.init_point;
    else throw new Error(data.error||"Payment URL was not received");
  }catch(e){el.textContent="Error: "+e.message;}
}

document.getElementById("btnActualizar").onclick=cargarPersonas;
document.getElementById("btnDonar").onclick=donar;
cargarPersonas();
</script>
</body>
</html>
