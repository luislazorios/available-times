name: Scrape

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: |
          npm i playwright cheerio --no-save
          npx playwright install chromium --with-deps
      - name: Scrapear
        run: |
        const { chromium } = require('playwright');

(async () => {
  const browser = await chromium.launch({ headless: true });
  const page = await browser.newPage();

  await page.goto(
    'https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ3787z0UDhWgBTk-CsglH0tGQQ3LSu4MS5ftylVNGebNq9ZzjugKtZEUqrjZkpvJJ2Ta9od8tmC',
    { waitUntil: 'domcontentloaded', timeout: 60000 }
  );

  await page.waitForTimeout(8000);

  console.log('\n========== TEXTO DE LA PÁGINA ==========\n');
  console.log((await page.locator('body').innerText()).slice(0, 10000));

  console.log('\n========== BOTONES ==========\n');

  const botones = await page.locator('button').evaluateAll(btns =>
    btns.map(b => ({
      texto: b.innerText,
      aria: b.getAttribute('aria-label'),
      disabled: b.disabled,
      title: b.title
    }))
  );

  console.log(JSON.stringify(botones, null, 2));

  await browser.close();
})();
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          
          # Guarda tu archivo nuevo fuera
          mv personas.json /tmp/personas.json.new
          
          # Limpia todo y trae lo último de GitHub sin conflictos
          git stash push --include-untracked -m "tmp" || true
          git fetch origin main
          git reset --hard origin/main
          
          # Vuelve a poner tu archivo nuevo encima
          mv /tmp/personas.json.new personas.json
          
          git add personas.json
          git commit -m "update personas $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push
