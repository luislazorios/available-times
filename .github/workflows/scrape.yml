name: Scrape

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: |
          npm i playwright cheerio --no-save
          npx playwright install chromium --with-deps
      - name: Scrapear
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();

            const url = 'https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ3787z0UDhWgBTk-CsglH0tGQQ3LSu4MS5ftylVNGebNq9ZzjugKtZEUqrjZkpvJJ2Ta9od8tmC';

            await page.goto(url, {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            await page.waitForTimeout(6000);

            const mes = await page.locator('body').innerText();

            const fechas = await page.locator('button[aria-label]').evaluateAll(btns =>
              btns.map(b => ({
                texto: b.innerText.trim(),
                aria: b.getAttribute('aria-label'),
                disabled: b.disabled
              })).filter(b =>
                b.aria &&
                !b.aria.toLowerCase().includes('no available times') &&
                !b.aria.toLowerCase().includes('previous') &&
                !b.aria.toLowerCase().includes('next') &&
                /^\d/.test(b.aria) &&
                !b.disabled
              )
            );

            console.log('FECHAS DISPONIBLES:');
            console.log(JSON.stringify(fechas, null, 2));

            if (fechas.length > 0) {
              const primera = fechas[0];

              console.log('PRIMER DIA:', primera.aria);

              await page.locator('button[aria-label]').filter({
                has: page.locator('text=' + primera.texto)
              }).first().click().catch(async () => {
                await page.getByRole('button', {
                  name: primera.aria,
                  exact: true
                }).click();
              });

              await page.waitForTimeout(2500);

              const horarios = await page.locator('button').evaluateAll(btns =>
                btns.map(b => ({
                  texto: b.innerText.trim(),
                  aria: b.getAttribute('aria-label')
                })).filter(b =>
                  /\d{1,2}:\d{2}\s*(am|pm)?/i.test(b.texto) ||
                  /\d{1,2}:\d{2}\s*(am|pm)?/i.test(b.aria || '')
                )
              );

              console.log('HORARIOS DEL PRIMER DIA:');
              console.log(JSON.stringify(horarios, null, 2));
            }

            await browser.close();
          })();
          EOF
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          
          # Guarda tu archivo nuevo fuera
          mv personas.json /tmp/personas.json.new
          
          # Limpia todo y trae lo último de GitHub sin conflictos
          git stash push --include-untracked -m "tmp" || true
          git fetch origin main
          git reset --hard origin/main
          
          # Vuelve a poner tu archivo nuevo encima
          mv /tmp/personas.json.new personas.json
          
          git add personas.json
          git commit -m "update personas $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push
