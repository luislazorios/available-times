name: Scrape

on:
  schedule:
    # Evita el minuto 00, que suele tener más retrasos en GitHub Actions.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: |
          npm i playwright cheerio --no-save
          npx playwright install chromium --with-deps

      - name: Scrapear
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');
          const cheerio = require('cheerio');
          const fs = require('fs');

          const BASE = 'https://sites.google.com/view/english-chat-student-center/Scheduling?authuser=0';
          const CONCURRENCY = 5;
          const MAX_MONTHS = 6;
          const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

          function decodeSafeLink(url) {
            try {
              if (url.includes('safelinks.protection.outlook.com')) {
                const real = new URL(url).searchParams.get('url');
                if (real) return decodeURIComponent(real);
              }
              return url;
            } catch { return url; }
          }

          function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
              '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
            })[ch]);
          }

          function getMonthYear(body) {
            const re = new RegExp('\\b(' + MONTHS.join('|') + ')\\s+(20\\d{2})\\b', 'i');
            const m = body.match(re);
            if (!m) return null;
            const month = MONTHS.findIndex(x => x.toLowerCase() === m[1].toLowerCase());
            return { month, year: Number(m[2]) };
          }

          function dateISO(year, month, day) {
            return new Date(Date.UTC(year, month, day)).toISOString().slice(0, 10);
          }

          async function readAvailableDays(page) {
            return await page.locator('button[aria-label]').evaluateAll(buttons =>
              buttons.map(b => ({
                aria: (b.getAttribute('aria-label') || '').trim(),
                text: (b.innerText || '').trim(),
                disabled: b.disabled || b.getAttribute('aria-disabled') === 'true'
              })).filter(b => {
                if (!b.aria || b.disabled) return false;
                if (/no available times|previous|next month|next day|previous day/i.test(b.aria)) return false;
                return /^\d{1,2},\s*(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\b/i.test(b.aria);
              })
            );
          }

          async function clickButtonByAria(page, aria) {
            return await page.locator('button[aria-label]').evaluateAll((buttons, target) => {
              const b = buttons.find(x => (x.getAttribute('aria-label') || '').trim() === target);
              if (!b) return false;
              b.click();
              return true;
            }, aria);
          }

          async function clickNextMonth(page) {
            const clicked = await page.locator('button').evaluateAll(buttons => {
              const b = buttons.find(x => {
                const label = [
                  x.getAttribute('aria-label') || '',
                  x.getAttribute('title') || '',
                  x.innerText || ''
                ].join(' ').toLowerCase();
                return label.includes('next month');
              });
              if (!b || b.disabled) return false;
              b.click();
              return true;
            });
            if (clicked) await page.waitForTimeout(1200);
            return clicked;
          }

          async function readFirstTime(page) {
            await page.waitForTimeout(1000);
            const times = await page.locator('button').evaluateAll(buttons =>
              buttons.map(b => ({
                text: (b.innerText || '').trim().replace(/\s+/g, ' '),
                aria: (b.getAttribute('aria-label') || '').trim(),
                disabled: b.disabled || b.getAttribute('aria-disabled') === 'true'
              })).filter(b => {
                if (b.disabled) return false;
                const value = b.text || b.aria;
                return /^\d{1,2}(?::\d{2})?\s*(am|pm)\b/i.test(value);
              })
            );
            return times.length ? (times[0].text || times[0].aria) : null;
          }

          async function firstAppointment(page, url) {
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(5000);

            let timezone = 'Zona horaria no indicada';
            const bodyText = await page.locator('body').innerText();
            const zone = bodyText.match(/\(GMT[+-]\d{2}:\d{2}\)[^\n]*/i);
            if (zone) timezone = zone[0].trim();

            for (let monthStep = 0; monthStep < MAX_MONTHS; monthStep++) {
              const body = await page.locator('body').innerText();
              const monthYear = getMonthYear(body);
              if (!monthYear) {
                return { fecha: null, hora: null, zona_horaria: timezone, motivo: 'No se pudo leer el mes del calendario' };
              }

              const days = await readAvailableDays(page);
              for (const day of days) {
                const match = day.aria.match(/^(\d{1,2}),/);
                if (!match) continue;
                const dayNumber = Number(match[1]);
                const clicked = await clickButtonByAria(page, day.aria);
                if (!clicked) continue;

                const hora = await readFirstTime(page);
                if (hora) {
                  return {
                    fecha: dateISO(monthYear.year, monthYear.month, dayNumber),
                    hora,
                    zona_horaria: timezone,
                    motivo: 'Primera hora confirmada'
                  };
                }
              }

              if (monthStep < MAX_MONTHS - 1) {
                const next = await clickNextMonth(page);
                if (!next) break;
              }
            }

            return { fecha: null, hora: null, zona_horaria: timezone, motivo: 'No se encontraron horarios en los próximos meses revisados' };
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ userAgent: 'Mozilla/5.0' });
            const page = await context.newPage();

            await page.goto(BASE, { waitUntil: 'networkidle', timeout: 60000 });

            let lastCount = 0, stable = 0;
            for (let s = 0; s < 80; s++) {
              await page.mouse.wheel(0, 4000);
              await page.waitForTimeout(1200);
              const count = await page.evaluate(() => document.querySelectorAll('a').length);
              console.log(`Scroll ${s + 1}: ${count} links`);
              if (count === lastCount) stable++; else stable = 0;
              lastCount = count;
              if (stable >= 5) break;
            }
            await page.waitForTimeout(2000);

            const $ = cheerio.load(await page.content());
            const candidatos = [];
            $('a').each((i, el) => {
              let link = $(el).attr('href');
              const nombre = $(el).text().trim();
              if (!link) return;
              link = decodeSafeLink(link);
              if (link.startsWith('https://') && nombre.length > 2 && nombre.length < 60 &&
                  !link.includes('google.com') && !link.includes('sites.google')) {
                if (!candidatos.find(c => c.link === link)) candidatos.push({ nombre, link });
              }
            });

            console.log(`Encontrados ${candidatos.length} candidatos`);
            if (candidatos.length < 10) {
              await browser.close();
              throw new Error('Muy pocos candidatos; se cancela para no sobrescribir los datos existentes.');
            }

            const detalle = [];
            const disponibles = [];
            for (let i = 0; i < candidatos.length; i += CONCURRENCY) {
              const lote = candidatos.slice(i, i + CONCURRENCY);
              console.log(`Revisando ${i + 1}-${Math.min(i + CONCURRENCY, candidatos.length)} de ${candidatos.length}`);

              const resultados = await Promise.all(lote.map(async c => {
                const p = await context.newPage();
                try {
                  const slot = await firstAppointment(p, c.link);
                  await p.close();
                  const result = { ...c, tiene_cita: !!(slot.fecha && slot.hora), ...slot };
                  if (result.tiene_cita) disponibles.push({
                    nombre: c.nombre,
                    link: c.link,
                    fecha: slot.fecha,
                    hora: slot.hora,
                    zona_horaria: slot.zona_horaria
                  });
                  return result;
                } catch (e) {
                  await p.close().catch(() => {});
                  return { ...c, tiene_cita: false, fecha: null, hora: null, motivo: 'Error: ' + e.message };
                }
              }));

              detalle.push(...resultados);
            }

            await browser.close();

            disponibles.sort((a, b) =>
              a.fecha.localeCompare(b.fecha) || a.hora.localeCompare(b.hora) || a.nombre.localeCompare(b.nombre)
            );

            const out = {
              personas: disponibles,
              revisados: candidatos.length,
              total_disponibles: disponibles.length,
              detalle,
              actualizado: new Date().toISOString()
            };

            fs.writeFileSync('personas.json', JSON.stringify(out, null, 2));

            console.log(`FINAL: ${candidatos.length} revisados; ${disponibles.length} con fecha y hora disponibles.`);
            console.log('Primeros resultados:', JSON.stringify(disponibles.slice(0, 10), null, 2));
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          EOF

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Respalda el resultado generado por el scraper.
          cp personas.json /tmp/personas.json.generated

          # Sincroniza con main antes de crear el commit.
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/personas.json.generated personas.json

          git add personas.json
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos"
            exit 0
          fi

          git commit -m "Actualizar disponibilidad de voluntarios"

          # Reintenta si otro cambio llega a main justo antes del push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Resultados publicados correctamente"
              exit 0
            fi
            echo "Push rechazado; sincronizando de nuevo (intento $attempt)"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/personas.json.generated personas.json
            git add personas.json
            git commit -m "Actualizar disponibilidad de voluntarios" || true
          done

          echo "No se pudo publicar después de 3 intentos"
          exit 1
